<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PlayNest Printables - Kids Activity & Coloring Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF5EA;
      --brand-peach: #F6AD55;
      --brand-sage: #9AE6B4;
      --brand-blue: #BEE3F8;
      --brand-dark: #2D3748;
      --brand-slate: #4A5568;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-cream);
      color: var(--brand-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #FFFFFF;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      z-index: 10;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      font-weight: 700;
      color: #DD6B20;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      border: 2px solid #E2E8F0;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: #FFFFFF;
      color: var(--brand-slate);
      transition: all 0.2s;
    }

    .mode-btn.active {
      border-color: #48BB78;
      background: #C6F6D5;
      color: #22543D;
    }

    .toolbar-panel {
      background: #FFFFFF;
      border-bottom: 2px solid #EAE0D5;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 9;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .tools-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      border: 2px solid #CBD5E0;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Fredoka', cursive;
      font-weight: 600;
    }

    .tool-btn.active {
      border-color: #E53E3E;
      background: #FFF5F5;
      color: #C53030;
      transform: scale(1.05);
    }

    .palette {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .color-swatch.active {
      transform: scale(1.25);
      border: 3px solid #1A202C;
    }

    .actions-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      border: none;
      border-radius: 999px;
      padding: 7px 16px;
      font-family: 'Fredoka', cursive;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      background: #EDF2F7;
      color: var(--brand-slate);
      transition: transform 0.1s;
    }

    .action-btn:active { transform: scale(0.96); }

    .action-btn.primary {
      background: #3182CE;
      color: #FFFFFF;
    }

    .voice-btn {
      border: none;
      border-radius: 999px;
      padding: 7px 16px;
      font-family: 'Fredoka', cursive;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      background: #ECC94B;
      color: #744210;
    }

    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 145px;
      background: #FFFDF9;
      border-right: 2px solid #F0E6D8;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .shelf-item {
      padding: 10px 8px;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .shelf-item span {
      font-size: 1.6rem;
    }

    .shelf-item.active {
      border-color: #ED8936;
      background: #FEEBC8;
      transform: scale(1.02);
    }

    .board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #FAF7F2;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .canvas-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    canvas {
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>

    <div class="brand-title">🎨 PlayNest Printables</div>
    <div class="mode-switch">
      <button class="mode-btn active" id="btn-coloring">🍎 Fruits</button>
      <button class="mode-btn" id="btn-busybooks">📚 6 Busy Books</button>
    </div>
  </header>

  <div class="toolbar-panel">
    <div class="tools-group">
      <button class="tool-btn active" id="tool-bucket">🪣 Fill</button>
      <button class="tool-btn" id="tool-brush">🖌️ Draw</button>
      <button class="tool-btn" id="tool-eraser">🧼 Erase</button>
    </div>

    <div class="palette" id="palette"></div>

    <div class="actions-group">
      <button class="voice-btn" id="btn-voice">🔊 <span id="item-title">Apple</span></button>
      <button class="action-btn" id="btn-clear">🔄 Clear</button>
      <button class="action-btn primary" id="btn-save">⬇️ Save</button>
    </div>
  </div>

  <div class="container">
    <aside class="sidebar" id="items-list"></aside>

    <main class="board-container">
      <div class="canvas-wrapper">
        <canvas id="paintCanvas" width="600" height="600"></canvas>
      </div>
    </main>
  </div>
