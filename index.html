<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayNest Printables - Coloring & Busy Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#18345e;--blue:#36a4f5;--sky:#eaf6ff;--green:#72cf4e;--cream:#fffdf8;--line:#dceaf5;--shadow:0 5px 16px rgba(35,83,125,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8fcff,#fffdf8);font-family:Nunito,sans-serif;color:var(--ink)}
header{min-height:104px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 24px;border-bottom:1px solid #e6f0f8;box-shadow:0 3px 12px #214d7110}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.brand-mark{font-size:54px;line-height:1}
.brand-name{font:700 clamp(25px,3vw,43px)/.95 Fredoka,sans-serif;color:#3294db}
.brand-name span{display:block;color:#f49a25;font-size:.68em;margin-left:35px}
.tagline{font:600 clamp(15px,1.8vw,24px) Fredoka,sans-serif;color:#153d86;white-space:nowrap}
.nav{display:flex;gap:12px;align-items:center}
.mode-btn{border:2px solid #d9eaf8;border-radius:30px;background:#f2f9ff;color:var(--ink);font:600 17px Fredoka;padding:12px 20px;cursor:pointer}
.mode-btn.active{background:#d9f7df;border-color:#9be5a6}
main{display:grid;grid-template-columns:190px minmax(300px,1fr) 220px;gap:14px;padding:14px;min-height:calc(100vh - 104px)}
.panel{background:#fff;border:1px solid #e3edf5;border-radius:28px;box-shadow:var(--shadow);padding:12px}
.left-panel{display:flex;flex-direction:column;gap:10px;overflow:auto}
.section-label{font:600 18px Fredoka;color:#17427a;padding:5px 8px}
.shelf-item{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #e3edf5;background:#fff;border-radius:17px;padding:10px 12px;font:700 15px Nunito;color:#243c5b;cursor:pointer}
.shelf-item span{font-size:25px}
.shelf-item.active{border-color:#40a7f6;background:#edf8ff}
.board{display:flex;align-items:center;justify-content:center;min-width:0;background:#fff;border:2px solid #dceaf5;border-radius:30px;padding:10px;box-shadow:var(--shadow);position:relative}
.canvas-wrap{width:min(100%,min(78vh,760px));aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;background:#fff;border-radius:18px;touch-action:none;display:block}
.right-panel{display:flex;flex-direction:column;gap:14px}
.tools{display:grid;grid-template-columns:1fr;gap:10px}
.tool-btn{border:2px solid #dceafa;border-radius:20px;min-height:88px;background:#eef8ff;color:#123d7d;font:700 19px Fredoka;cursor:pointer}
.tool-btn:nth-child(2){background:#fff4e8;border-color:#ffe2ad}
.tool-btn:nth-child(3){background:#f4edff;border-color:#e4d5ff}
.tool-btn.active{outline:3px solid #45aaf7;outline-offset:1px}
.colors-title{text-align:center;font:600 23px Fredoka;margin:4px 0 10px}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center}
.color-swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 7px #0002;cursor:pointer}
.color-swatch.active{outline:3px solid #328fe0}
.action-btn{border:0;border-radius:24px;padding:15px 12px;color:#fff;font:700 21px Fredoka;cursor:pointer;box-shadow:0 4px 9px #0002}
.save{background:#168ff0}.print{background:#69c94a}
.voice-btn{border:0;border-radius:20px;padding:10px;background:#fff5d9;color:#79521a;font:700 16px Fredoka;cursor:pointer}
.footer-note{text-align:center;font:600 13px Nunito;color:#7591aa}
button:focus-visible{outline:3px solid #174f9a;outline-offset:2px}
@media(max-width:900px){main{grid-template-columns:150px minmax(240px,1fr);}.right-panel{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;align-items:start}.tools{grid-template-columns:repeat(3,1fr)}.tool-btn{min-height:65px;font-size:15px}.board{min-height:420px}.canvas-wrap{width:min(100%,68vh)}}
@media(max-width:600px){header{padding:10px;flex-wrap:wrap}.brand{min-width:0}.brand-mark{font-size:38px}.tagline{display:none}.nav{width:100%;justify-content:center}.mode-btn{font-size:14px;padding:9px 14px}main{padding:8px;grid-template-columns:1fr;gap:9px}.left-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.section-label{grid-column:1/-1}.shelf-item{justify-content:center;flex-direction:column;padding:7px 3px;font-size:12px;gap:2px}.shelf-item span{font-size:21px}.board{min-height:0;padding:5px}.canvas-wrap{width:100%}.right-panel{grid-column:auto;grid-template-columns:1fr}.tools{grid-template-columns:repeat(3,1fr)}.tool-btn{min-height:58px}.palette{grid-template-columns:repeat(6,1fr)}.color-swatch{width:34px;height:34px}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="brand-mark">📖🌱</div><div class="brand-name">PlayNest<span>Printables</span></div></div>
 <div class="tagline">Play • Learn • Grow ♡</div>
 <nav class="nav"><button class="mode-btn active" id="btn-coloring">🎨 Coloring</button><button class="mode-btn" id="btn-busybooks">📚 Busy Books</button></nav>
</header>
<main>
 <aside class="panel left-panel"><div class="section-label" id="shelf-heading">🍎 Fruits</div><div id="items-list"></div></aside>
 <section class="board"><div class="canvas-wrap"><canvas id="paintCanvas" width="700" height="700" aria-label="Coloring page"></canvas></div></section>
 <aside class="panel right-panel">
  <div><div class="section-label">Tools</div><div class="tools">
   <button class="tool-btn active" id="tool-bucket">🪣<br>Fill</button><button class="tool-btn" id="tool-brush">✏️<br>Draw</button><button class="tool-btn" id="tool-eraser">🧽<br>Erase</button>
  </div></div>
  <div><div class="colors-title">Colors</div><div class="palette" id="palette"></div></div>
  <button class="voice-btn" id="btn-voice">🔊 Hear the word: <span id="item-title">Apple</span></button>
  <button class="action-btn save" id="btn-save">⬇ Save picture</button>
  <button class="action-btn print" id="btn-print">🖨 Print</button>
  <button class="voice-btn" id="btn-clear">↻ Clear coloring</button>
  <div class="footer-note">Have fun coloring! 🌈</div>
 </aside>
</main>
<script>
const coloringItems=[
 {id:'apple',title:'Apple',icon:'🍎'},
 {id:'banana',title:'Banana',icon:'🍌'},
 {id:'grapes',title:'Grapes',icon:'🍇'},
 {id:'strawberry',title:'Strawberry',icon:'🍓'},
 {id:'pineapple',title:'Pineapple',icon:'🍍'},
 {id:'watermelon',title:'Watermelon',icon:'🍉'}
];
const busyBookItems=[
 {id:'princess',title:'Princess',icon:'👑'},
 {id:'mermaid',title:'Mermaid',icon:'🧜‍♀️'},
 {id:'irobot',title:'Robot',icon:'🤖'},
 {id:'dinosaur',title:'Dinosaur',icon:'🦖'},
 {id:'construction',title:'Dump Truck',icon:'🚜'},
 {id:'animals',title:'Lion',icon:'🦁'}
];
const colors=['#ef3434','#ff8a18','#ffd52e','#43bd50','#169bea','#8752d9','#f16eae','#9a5729','#222222'];
let currentCategory='coloring',currentItem=coloringItems[0],currentTool='bucket',currentColor=colors[0],isDrawing=false;
const canvas=document.getElementById('paintCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const svgTemplates={
apple:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="10" d="M350 230 C300 180 210 190 165 250 C100 340 155 535 260 590 C305 612 330 585 350 585 C370 585 395 612 440 590 C545 535 600 340 535 250 C490 190 400 180 350 230Z"/><path stroke-width="10" d="M350 235 C345 190 360 145 400 112 C420 96 435 115 420 132 C392 158 380 190 385 230"/><path stroke-width="8" d="M375 185 C405 100 505 80 570 115 C530 190 445 220 375 185Z"/><path stroke-width="4" fill="none" d="M390 180 Q460 130 550 120 M425 168 L440 130 M455 155 L485 105 M480 145 L520 115 M390 185 L430 190"/><path stroke-width="4" fill="none" d="M180 300 Q210 250 255 245 M520 300 Q490 250 450 245 M190 440 Q205 520 260 550 M510 440 Q495 520 440 550"/></g></svg>`,
banana:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="11" d="M155 190 C205 300 330 450 520 480 C565 487 590 460 580 425 C570 395 540 385 510 390 C365 405 250 280 215 170 C200 130 135 145 155 190Z"/><path stroke-width="8" d="M150 175 Q130 145 145 115 Q170 105 190 140 M575 420 Q615 425 620 455 Q610 490 570 485"/><path fill="none" stroke-width="4" d="M190 205 Q275 350 430 420 M220 200 Q300 325 455 390"/></g></svg>`,
grapes:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="9" d="M350 180 Q350 130 395 100 Q420 85 440 105 Q420 145 380 170"/><path stroke-width="8" d="M350 175 Q270 105 220 145 Q270 210 350 190Z"/><g stroke-width="8"><circle cx="300" cy="250" r="65"/><circle cx="410" cy="250" r="65"/><circle cx="245" cy="365" r="65"/><circle cx="365" cy="365" r="65"/><circle cx="475" cy="365" r="65"/><circle cx="300" cy="480" r="65"/><circle cx="415" cy="480" r="65"/><circle cx="355" cy="585" r="55"/></g><g fill="none" stroke-width="3"><path d="M265 220 Q285 195 310 205 M375 220 Q395 195 420 205 M210 340 Q230 315 250 320 M330 340 Q350 315 375 320 M440 340 Q460 315 485 320"/></g></g></svg>`,
strawberry:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="10" d="M350 225 C260 155 150 205 150 310 C150 420 260 545 350 600 C440 545 550 420 550 310 C550 205 440 155 350 225Z"/><path stroke-width="8" d="M350 230 Q300 165 230 190 Q265 245 325 250 M350 230 Q390 155 475 185 Q440 240 375 250 M350 230 Q350 170 350 135"/><g fill="none" stroke-width="5"><path d="M235 300 l12 22 M320 285 l12 22 M420 300 l12 22 M500 340 l12 22 M190 390 l12 22 M275 405 l12 22 M375 390 l12 22 M465 430 l12 22 M330 510 l12 22 M410 500 l12 22"/></g></g></svg>`,
pineapple:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="10" d="M235 255 Q350 205 465 255 Q535 365 480 545 Q350 625 220 545 Q165 365 235 255Z"/><path stroke-width="9" d="M300 260 Q230 155 255 85 Q325 145 350 245 Q365 120 435 75 Q450 175 390 260 M350 245 Q350 120 350 55 M400 260 Q465 155 520 145 Q510 235 440 285"/><g fill="none" stroke-width="5"><path d="M220 315 L470 535 M190 390 L420 590 M240 275 L500 505 M480 315 L230 535 M510 390 L280 590 M460 275 L200 505"/><path d="M260 330 l30 -5 M310 380 l30 -5 M365 430 l30 -5 M410 480 l30 -5 M400 320 l-30 5 M350 370 l-30 5 M300 420 l-30 5"/></g></g></svg>`,
watermelon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="11" d="M120 300 Q350 625 580 300 Q350 400 120 300Z"/><path stroke-width="8" d="M150 315 Q350 580 550 315"/><g fill="none" stroke-width="5"><path d="M220 350 Q235 420 275 465 M300 385 Q315 455 345 485 M390 385 Q390 450 420 475 M475 350 Q460 415 430 455"/></g><g fill="#111" stroke="none"><ellipse cx="255" cy="385" rx="9" ry="17" transform="rotate(-25 255 385)"/><ellipse cx="350" cy="430" rx="9" ry="17"/><ellipse cx="445" cy="385" rx="9" ry="17" transform="rotate(25 445 385)"/></g></g></svg>`,
princess:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="9" d="M270 210 L245 120 L320 170 L355 90 L390 170 L465 120 L440 215Z"/><path stroke-width="9" d="M350 205 C260 205 220 275 240 350 Q260 415 350 420 Q440 415 460 350 C480 275 440 205 350 205Z"/><path stroke-width="8" d="M250 410 Q350 370 450 410 L560 590 Q350 650 140 590Z"/><path stroke-width="7" d="M270 270 Q350 310 430 270 M300 335 Q350 365 400 335"/><path stroke-width="5" fill="none" d="M285 290 Q300 270 315 290 M385 290 Q400 270 415 290 M350 420 L350 585 M240 500 Q350 540 460 500"/></g></svg>`,
mermaid:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="9" d="M280 150 Q350 80 420 150 Q455 205 420 270 Q390 320 350 320 Q310 320 280 270 Q245 205 280 150Z"/><path stroke-width="8" d="M280 190 Q220 230 255 300 M420 190 Q480 230 445 300"/><path stroke-width="8" d="M285 315 Q350 355 415 315 L390 465 Q350 500 310 465Z"/><path stroke-width="9" d="M310 455 Q260 520 190 560 Q275 620 350 555 Q425 620 510 560 Q440 520 390 455"/><path stroke-width="5" fill="none" d="M300 220 Q350 245 400 220 M315 275 Q350 300 385 275 M315 390 Q350 415 385 390 M350 360 L350 455"/></g></svg>`,
irobot:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><rect x="210" y="150" width="280" height="220" rx="55" stroke-width="10"/><rect x="255" y="205" width="190" height="95" rx="25" stroke-width="7"/><circle cx="305" cy="250" r="18" stroke-width="6"/><circle cx="395" cy="250" r="18" stroke-width="6"/><path d="M305 325 Q350 355 395 325" fill="none" stroke-width="7"/><path d="M350 150 V95 M325 95 Q350 55 375 95" fill="none" stroke-width="9"/><rect x="250" y="375" width="200" height="170" rx="30" stroke-width="10"/><path d="M210 420 L145 470 L185 510 L250 475 M490 420 L555 470 L515 510 L450 475" fill="none" stroke-width="10"/><path d="M295 545 L280 620 M405 545 L420 620" fill="none" stroke-width="13"/></g></svg>`,
dinosaur:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="10" d="M180 430 Q145 330 225 260 Q300 195 405 245 Q465 270 490 340 L585 385 Q620 405 590 430 L490 430 Q470 520 385 540 L380 615 L320 615 L315 535 Q260 540 245 615 L185 615 L205 500 Q170 480 180 430Z"/><path stroke-width="9" d="M390 245 Q430 190 465 215 L445 275 M330 230 L310 180 L370 230"/><circle cx="445" cy="310" r="12" stroke-width="5"/><path stroke-width="6" d="M505 390 Q540 405 565 390 M245 330 Q270 305 295 325 M300 410 Q330 380 360 410 M370 470 Q400 440 430 470"/></g></svg>`,
construction:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="10" d="M145 350 H390 L455 420 V510 H145Z"/><path stroke-width="10" d="M390 350 L470 280 L550 330 L500 420 H455"/><path stroke-width="9" d="M185 350 V255 H340 V350 M210 275 H315 V350"/><path stroke-width="8" d="M145 420 H500 M500 420 L565 450 L535 490 H455"/><circle cx="245" cy="520" r="55" stroke-width="10"/><circle cx="450" cy="520" r="55" stroke-width="10"/><circle cx="245" cy="520" r="20" stroke-width="6"/><circle cx="450" cy="520" r="20" stroke-width="6"/></g></svg>`,
animals:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><g fill="white" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><circle cx="350" cy="365" r="185" stroke-width="10"/><g stroke-width="8"><circle cx="205" cy="220" r="75"/><circle cx="495" cy="220" r="75"/><circle cx="350" cy="365" r="130"/></g><path stroke-width="7" d="M275 350 Q300 325 325 350 M375 350 Q400 325 425 350 M325 420 Q350 450 375 420 M350 385 L350 405"/><path stroke-width="5" fill="none" d="M230 390 L300 400 M225 430 L300 425 M470 390 L400 400 M475 430 L400 425"/></g></svg>`
};
function setupSidebar(){const list=document.getElementById('items-list');list.innerHTML='';const items=currentCategory==='coloring'?coloringItems:busyBookItems;document.getElementById('shelf-heading').textContent=currentCategory==='coloring'?'🍎 Fruits':'📚 Busy Books';items.forEach(item=>{const b=document.createElement('button');b.className='shelf-item'+(item.id===currentItem.id?' active':'');b.innerHTML=`<span>${item.icon}</span>${item.title}`;b.onclick=()=>{currentItem=item;setupSidebar();loadTemplate()};list.appendChild(b)});document.getElementById('item-title').textContent=currentItem.title}
function setupPalette(){const p=document.getElementById('palette');p.innerHTML='';colors.forEach(c=>{const s=document.createElement('button');s.className='color-swatch'+(c===currentColor?' active':'');s.style.background=c;s.setAttribute('aria-label','Select '+c);s.onclick=()=>{currentColor=c;if(currentTool==='eraser')setTool('brush');setupPalette()};p.appendChild(s)})}
function setTool(t){currentTool=t;['bucket','brush','eraser'].forEach(x=>document.getElementById('tool-'+x).classList.toggle('active',x===t))}
function loadTemplate(){ctx.clearRect(0,0,700,700);ctx.fillStyle='#fff';ctx.fillRect(0,0,700,700);const svg=svgTemplates[currentItem.id]||svgTemplates.apple;const blob=new Blob([svg],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,700,700);URL.revokeObjectURL(url)};img.src=url}
function floodFill(sx,sy,fill){if(sx<0||sy<0||sx>=700||sy>=700)return;const im=ctx.getImageData(0,0,700,700),d=im.data,start=(sy*700+sx)*4,tr=d[start],tg=d[start+1],tb=d[start+2];if(tr===fill.r&&tg===fill.g&&tb===fill.b)return;if(tr<55&&tg<55&&tb<55)return;const match=i=>Math.abs(d[i]-tr)<30&&Math.abs(d[i+1]-tg)<30&&Math.abs(d[i+2]-tb)<30;const stack=[[sx,sy]],seen=new Uint8Array(700*700);while(stack.length){const [x,y]=stack.pop();if(x<0||y<0||x>=700||y>=700)continue;const n=y*700+x;if(seen[n])continue;seen[n]=1;const i=n*4;if(match(i)){d[i]=fill.r;d[i+1]=fill.g;d[i+2]=fill.b;d[i+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}}ctx.putImageData(im,0,0)}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return{r:n>>16&255,g:n>>8&255,b:n&255}}
function setupDrawing(){const pos=e=>{const r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*700/r.width),y:Math.floor((e.clientY-r.top)*700/r.height)}};canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=pos(e);if(currentTool==='bucket')floodFill(p.x,p.y,hexToRgb(currentColor));else{isDrawing=true;ctx.beginPath();ctx.moveTo(p.x,p.y)}});canvas.addEventListener('pointermove',e=>{if(!isDrawing)return;const p=pos(e);ctx.lineWidth=currentTool==='eraser'?26:10;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=currentTool==='eraser'?'#fff':currentColor;ctx.lineTo(p.x,p.y);ctx.stroke()});const stop=()=>isDrawing=false;canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);window.addEventListener('pointerup',stop)}
function switchCategory(cat){currentCategory=cat;document.getElementById('btn-coloring').classList.toggle('active',cat==='coloring');document.getElementById('btn-busybooks').classList.toggle('active',cat==='busybooks');currentItem=(cat==='coloring'?coloringItems:busyBookItems)[0];setupSidebar();loadTemplate()}
document.getElementById('btn-coloring').onclick=()=>switchCategory('coloring');document.getElementById('btn-busybooks').onclick=()=>switchCategory('busybooks');document.getElementById('tool-bucket').onclick=()=>setTool('bucket');document.getElementById('tool-brush').onclick=()=>setTool('brush');document.getElementById('tool-eraser').onclick=()=>setTool('eraser');document.getElementById('btn-clear').onclick=loadTemplate;document.getElementById('btn-voice').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(currentItem.title);u.rate=.85;speechSynthesis.speak(u)}};document.getElementById('btn-save').onclick=()=>{const a=document.createElement('a');a.download=currentItem.id+'-playnest.png';a.href=canvas.toDataURL('image/png');a.click()};document.getElementById('btn-print').onclick=()=>{const data=canvas.toDataURL('image/png');const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to print your coloring page.');return}w.document.write(`<html><head><title>${currentItem.title} coloring page</title><style>body{margin:0;display:grid;place-items:center}img{width:95vw;max-width:7.5in}</style></head><body><img src="${data}" onload="window.print()"></body></html>`);w.document.close()};
setupPalette();setupSidebar();setupDrawing();loadTemplate();
</script>
</body>
</html>
